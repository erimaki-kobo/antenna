name: collect
# アンテナ①：3時間ごとに情報源を取って data/ に貯める

on:
  schedule:
    - cron: "17 */3 * * *"   # UTC。日本時間 2:17, 5:17, 8:17, ...
  workflow_dispatch: {}

concurrency:
  group: antenna-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r src/requirements.txt
      - name: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/collect.py
      - name: commit
        run: |
          git config user.name "antenna-bot"
          git config user.email "antenna-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
